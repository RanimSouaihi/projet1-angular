<div class="conferences-page">
  <div class="header-row">
    <h1>Conferences</h1>
    <button class="add-button" (click)="goToAddConference()">+ Ajouter une conférence</button>
  </div>

  <div class="conference-grid">
    @for (conf of conferences; track conf.id) {
      <div class="conference-card">
        <img [src]="conferenceImage" [alt]="conf.title" />
        <div class="card-content">
          <p class="card-title">{{ conf.title }}</p>
          <p class="card-meta">📅 {{ conf.date }}</p>
          <p class="card-meta">📍 {{ conf.place }}</p>
          @if (conf.speaker) {
            <p class="card-meta">👤 {{ conf.speaker }}</p>
          }
        </div>
        <div class="card-buttons">
          <button class="details-button" (click)="goToDetail(conf.id)">Details</button>
          <button class="edit-button" (click)="editConference(conf.id, $event)">Modifier</button>
        </div>
      </div>
    } @empty {
      <p class="empty-msg">Aucune conférence disponible pour le moment.</p>
    }
  </div>
</div>
