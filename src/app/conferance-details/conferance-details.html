{{id()}}
<div class="card">
  <div class="card-header">
    <span class="badge">CONFERENCE</span>
    <h1>{{ conference.name }}</h1>
  </div>

  <div class="card-body">
    <div class="info">
      <span class="icon">📅</span>
      <div>
        <span class="label">Date</span>
        <p>{{ conference.date }}</p>
      </div>
    </div>

    <div class="info">
      <span class="icon">📍</span>
      <div>
        <span class="label">Place</span>
        <p>{{ conference.place }}</p>
      </div>
    </div>

    <a (click)="goBack()" class="back-link">
      ← Back to conferences
    </a>
  </div>
</div>
